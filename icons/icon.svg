<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square with Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Glass Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-opacity="0.6"/>
  
  <!-- Center Cantonese Traditional Character "粵" -->
  <text x="256" y="340" 
        font-family="'Noto Sans HK', 'PingFang HK', 'Microsoft JhengHei', sans-serif" 
        font-size="280" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        filter="url(#dropShadow)">
    粵
  </text>
  
  <!-- Mini Audio Waves Symbol -->
  <path d="M 380 180 A 60 60 0 0 1 380 260" fill="none" stroke="#6ee7b7" stroke-width="14" stroke-linecap="round"/>
  <path d="M 405 160 A 90 90 0 0 1 405 280" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round"/>
</svg>
